<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aesthetic Generator</title>
    <style>
      :root {
        --ivory: #f6f1ea;
        --paper: #fffdf9;
        --card: rgba(255, 255, 255, 0.7);
        --text: #1f1b1a;
        --muted: #6a615e;
        --muted-2: #8f807b;
        --taupe: #b8a39b;
        --sage: #aab79d;
        --rose: #d4a7aa;
        --clay: #c99478;
        --shadow: 0 18px 40px rgba(54, 38, 32, 0.08);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background: linear-gradient(180deg, #f8f3ee 0%, #f3eee8 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 40px 18px;
      }

      .app-shell {
        width: min(1400px, 100%);
        display: grid;
        grid-template-columns: minmax(280px, 440px) minmax(360px, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.42);
        border: 1px solid rgba(121, 108, 101, 0.09);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .controls {
        padding: 22px 20px 18px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 4px 18px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand-mark {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: var(--muted-2);
        text-transform: uppercase;
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.3rem);
        letter-spacing: -0.06em;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
      }

      .status-pill {
        border-radius: 999px;
        border: 1px solid rgba(92, 75, 69, 0.14);
        background: rgba(255,255,255,0.24);
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 8px 12px;
      }

      .section-block {
        border-top: 1px solid rgba(92,75,69,0.08);
        padding-top: 18px;
        margin-top: 18px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .section-header h2 {
        margin: 0;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .count-picker {
        display: grid;
        gap: 12px;
      }

      .count-slider-wrap {
        background: rgba(255,255,255,0.32);
        border: 1px solid rgba(92,75,69,0.1);
        border-radius: 16px;
        padding: 12px 12px 10px;
      }

      .count-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(to right, #1f1b1a 0%, #1f1b1a var(--range-percent), rgba(106,97,94,0.12) var(--range-percent), rgba(106,97,94,0.12) 100%);
        outline: none;
      }

      .count-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: white;
        border-radius: 50%;
        border: 2px solid #1f1b1a;
        box-shadow: 0 6px 16px rgba(61,51,46,0.18);
        cursor: pointer;
      }

      .count-slider-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .count-slider-value {
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.08em;
      }

      .count-button {
        height: 40px;
        min-width: 42px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(92,75,69,0.12);
        background: rgba(255,255,255,0.32);
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }

      .count-button.active {
        background: var(--text);
        color: white;
        border-color: var(--text);
      }

      .count-button,
      .preset-button,
      .style-card,
      .toolbar-button,
      .remove-button,
      .action-button {
        transition: all 0.2s ease;
      }

      .color-list {
        display: grid;
        gap: 12px;
      }

      .color-row {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 10px;
        align-items: center;
        background: rgba(255,255,255,0.35);
        border: 1px solid rgba(106,97,94,0.1);
        border-radius: 18px;
        padding: 10px 12px;
      }

      .color-order {
        display: inline-flex;
        width: 26px;
        height: 26px;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background: rgba(36,34,33,0.06);
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 700;
      }

      .color-swatch-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .color-swatch {
        width: 38px;
        height: 38px;
        border: none;
        background: transparent;
        border-radius: 10px;
        padding: 0;
        overflow: hidden;
        cursor: pointer;
      }

      .color-swatch::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .color-swatch::-webkit-color-swatch {
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 10px;
      }

      .hex-input {
        width: 100%;
        border: 1px solid rgba(122, 109, 102, 0.1);
        background: rgba(255,255,255,0.3);
        border-radius: 10px;
        padding: 10px 10px;
        font-size: 0.82rem;
        color: var(--text);
      }

      .remove-button {
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.25rem;
        line-height: 1;
        padding: 0 4px;
      }

      .remove-button:hover { color: var(--text); }

      .presets-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .preset-button {
        border-radius: 999px;
        border: 1px solid rgba(92,75,69,0.12);
        background: rgba(255,255,255,0.28);
        color: var(--text);
        padding: 8px 12px;
        cursor: pointer;
        font-size: 0.75rem;
      }

      .style-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(110px, 1fr));
        gap: 10px;
      }

      .style-card {
        border: 1px solid rgba(92,75,69,0.1);
        background: rgba(255,255,255,0.3);
        border-radius: 16px;
        padding: 12px 12px 10px;
        cursor: pointer;
        text-align: left;
      }

      .style-card.active {
        background: linear-gradient(180deg, rgba(28, 24, 24, 0.96) 0%, rgba(52, 43, 41, 0.94) 100%);
        color: white;
        border-color: transparent;
      }

      .style-card small {
        display: block;
        margin-top: 4px;
        opacity: 0.72;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .style-card strong {
        font-size: 0.98rem;
        letter-spacing: -0.03em;
      }

      .distribution-list {
        display: grid;
        gap: 12px;
      }

      .dist-row {
        display: grid;
        grid-template-columns: minmax(78px, 110px) 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .dist-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .dist-swatch {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
        flex-shrink: 0;
      }

      .dist-title {
        font-size: 0.76rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .dist-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(to right, var(--swatch) 0%, var(--swatch) var(--percent), rgba(106,97,94,0.12) var(--percent), rgba(106,97,94,0.12) 100%);
        outline: none;
      }

      .dist-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        border: 2px solid var(--swatch);
        box-shadow: 0 6px 16px rgba(61,51,46,0.18);
        cursor: pointer;
      }

      .dist-value {
        min-width: 48px;
        text-align: right;
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      .action-button,
      .toolbar-button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
      }

      .action-button {
        background: linear-gradient(135deg, #1b1717 0%, #352f2e 100%);
        color: white;
        box-shadow: 0 12px 24px rgba(38,30,29,0.15);
      }

      .toolbar-button {
        background: rgba(255,255,255,0.35);
        color: var(--text);
        border: 1px solid rgba(92,75,69,0.1);
      }

      .result-card {
        padding: 22px;
        min-height: 100%;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .result-header h3 {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 700;
      }

      .result-badge {
        background: rgba(154, 168, 140, 0.15);
        color: #3d5440;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .moodboard-stage {
        position: relative;
        background: linear-gradient(180deg, #f3e9e2 0%, #efe3d9 100%);
        border-radius: 24px;
        border: 1px solid rgba(97,86,82,0.12);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
      }

      .moodboard-stage svg {
        display: block;
        width: 100%;
        height: 420px;
      }

      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 18px;
      }

      .mini-panel {
        background: rgba(255,255,255,0.38);
        border: 1px solid rgba(92,75,69,0.08);
        border-radius: 18px;
        padding: 16px;
      }

      .mini-panel h4 {
        margin: 0 0 12px;
        font-size: 0.72rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .swatch-list {
        display: grid;
        gap: 10px;
      }

      .swatch-item {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 10px;
        align-items: center;
        font-size: 0.8rem;
      }

      .swatch-item .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
      }

      .distribution-summary {
        display: grid;
        gap: 8px;
      }

      .distribution-summary .entry {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .distribution-summary .bar {
        position: relative;
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: rgba(117,102,96,0.12);
        overflow: hidden;
      }

      .distribution-summary .bar > span {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: inherit;
      }

      .story {
        margin-top: 18px;
        background: rgba(255,255,255,0.38);
        border: 1px solid rgba(92,75,69,0.08);
        border-radius: 18px;
        padding: 18px 18px 16px;
      }

      .story h4 {
        margin: 0 0 10px;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .story p {
        margin: 0;
        color: var(--text);
        line-height: 1.65;
        font-size: 0.98rem;
      }

      .recommendations {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .recommend-item {
        background: rgba(255,255,255,0.34);
        border-radius: 16px;
        border: 1px solid rgba(92,75,69,0.08);
        padding: 14px 12px;
      }

      .recommend-item .label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .recommend-item strong {
        line-height: 1.5;
        font-size: 0.93rem;
      }

      @media (max-width: 980px) {
        .app-shell {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        body { padding: 20px 12px; }

        .controls,
        .result-card { padding: 16px; }

        .result-grid,
        .recommendations,
        .style-grid { grid-template-columns: 1fr; }

        .color-row {
          grid-template-columns: auto 1fr auto;
        }

        .color-order { display: none; }

        .remove-button { grid-column: 2 / -1; justify-self: end; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel controls">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark">Aesthetic Engine</span>
            <h1>Generator</h1>
          </div>
          <div class="status-pill">Live</div>
        </div>

        <div class="section-block">
          <div class="section-header">
            <h2>Color Count</h2>
          </div>
          <div id="countPicker" class="count-picker"></div>
        </div>

        <div class="section-block">
          <div class="section-header">
            <h2>Palette</h2>
          </div>
          <div id="colorFields" class="color-list"></div>
        </div>

        <div class="section-block">
          <div class="section-header">
            <h2>Palette Presets</h2>
          </div>
          <div id="presetGrid" class="presets-grid"></div>
        </div>

        <div class="section-block">
          <div class="section-header">
            <h2>Aesthetic Type</h2>
          </div>
          <div id="styleGrid" class="style-grid"></div>
        </div>

        <div class="section-block">
          <div class="section-header">
            <h2>Color Distribution</h2>
          </div>
          <div id="distributionList" class="distribution-list"></div>
        </div>

        <div class="toolbar">
          <button class="action-button" id="generateBtn">Generate My Aesthetic</button>
          <button class="toolbar-button" id="regenerateBtn">Regenerate</button>
          <button class="toolbar-button" id="resetBtn">Reset</button>
          <button class="toolbar-button" id="downloadBtn">Download PNG</button>
        </div>
      </aside>

      <main class="panel result-card">
        <div class="result-header">
          <h3>Generated Moodboard</h3>
          <div id="resultBadge" class="result-badge">Coquette</div>
        </div>

        <div class="moodboard-stage">
          <svg id="moodboardSvg" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-label="Generated aesthetic moodboard"></svg>
        </div>

        <div class="result-grid">
          <div class="mini-panel">
            <h4>Palette</h4>
            <div id="paletteList" class="swatch-list"></div>
          </div>

          <div class="mini-panel">
            <h4>Distribution</h4>
            <div id="distributionSummary" class="distribution-summary"></div>
          </div>
        </div>

        <div class="story">
          <h4>Aesthetic DNA</h4>
          <p id="descriptionText"></p>
        </div>

        <div class="recommendations">
          <div class="recommend-item">
            <span class="label">Typography</span>
            <strong id="typographyRec">Elegant serif</strong>
          </div>
          <div class="recommend-item">
            <span class="label">Textures</span>
            <strong id="textureRec">Lace and parchment</strong>
          </div>
          <div class="recommend-item">
            <span class="label">Motifs</span>
            <strong id="motifRec">Ribbons and roses</strong>
          </div>
        </div>
      </main>
    </div>

      const presetPalettes = {

      };

      const defaultNames = ['Cream', 'Dusty Rose', 'Chocolate', 'Sage', 'Blush', 'Stone', 'Peony', 'Heather'];
      const state = {
        colorCount: 4,

      function clampCount(value) {
        return Math.min(8, Math.max(2, Number(value) || 2));
      }

      function isValidHex(value) {
        return /^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(String(value || '').trim());
      }

      function normalizeHex(value, fallback = '#C98F94') {
        if (!value) return fallback;
        const trimmed = String(value).trim();
        if (!isValidHex(trimmed)) return fallback;
        if (trimmed.length === 4) {
          return '#' + trimmed.slice(1).split('').map(char => char + char).join('').toUpperCase();
        }
        return trimmed.toUpperCase();
      }

      function hexToRgb(hex) {
        const safe = normalizeHex(hex, '#000000');
        const clean = safe.replace('#', '');
        const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
        const num = parseInt(full, 16);
        return {
          r: (num >> 16) & 255,
          g: (num >> 8) & 255,
          b: num & 255
        };
      }

      function rgbToHex(r, g, b) {
        const toHex = (value) => value.toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
      }

      function mixHex(colorA, colorB, weight = 0.5) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        const mix = (start, end) => Math.round(start + (end - start) * weight);
        return rgbToHex(mix(a.r, b.r), mix(a.g, b.g), mix(a.b, b.b));
      }

      function lightenHex(hex, amount = 0.15) {
        return mixHex('#FFFFFF', hex, amount);
      }

      function darkenHex(hex, amount = 0.2) {
        return mixHex('#000000', hex, amount);
      }

      function sortColorIndexesByPercentage(colorSet, percentages) {
        return colorSet
          .map((_, index) => index)
          .sort((a, b) => percentages[b] - percentages[a]);
      }

      function normalizeColorCount() {
        while (state.colors.length < state.colorCount) {
          const nextIndex = state.colors.length;
          const fallbackHex = defaultNames[nextIndex % defaultNames.length];
          state.colors.push({
            hex: presetPalettes.Rosy[nextIndex % presetPalettes.Rosy.length],
            name: fallbackHex
          });
        }

        if (state.colors.length > state.colorCount) {
          state.colors = state.colors.slice(0, state.colorCount);
        }

        while (state.percentages.length < state.colorCount) {
          state.percentages.push(Math.max(1, Math.round(100 / state.colorCount)));
        }

        if (state.percentages.length > state.colorCount) {
          state.percentages = state.percentages.slice(0, state.colorCount);
        }

        const total = state.percentages.reduce((sum, value) => sum + Number(value || 0), 0);
        if (total !== 100) {
          const distribution = Array.from({ length: state.colorCount }, (_, index) => {
            if (index < state.percentages.length && Number.isFinite(state.percentages[index])) return Number(state.percentages[index]);
            return 0;
          });
          const totalDistribution = distribution.reduce((sum, value) => sum + value, 0);
          const fill = totalDistribution === 0 ? 100 / state.colorCount : totalDistribution;
          let next = distribution.map((value) => value > 0 ? (value / fill) * 100 : 0);
          next = next.map((value) => Number(value.toFixed(1)));
          let difference = 100 - next.reduce((sum, value) => sum + value, 0);
          const finalIndex = next.length - 1;
          next[finalIndex] += difference;
          state.percentages = next.map((value) => Math.max(1, Math.round(value)));
          let finalSum = state.percentages.reduce((sum, value) => sum + value, 0);
          while (finalSum !== 100 && finalSum < 100) {
            state.percentages[finalIndex] += 1;
            finalSum += 1;
          }
          while (finalSum !== 100 && finalSum > 100) {
            state.percentages[finalIndex] -= 1;
            finalSum -= 1;
          }
        }
      }

      function renderCountPicker() {
        countPicker.innerHTML = '';

        const sliderWrap = document.createElement('div');
        sliderWrap.className = 'count-slider-wrap';

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = '2';
        slider.max = '8';
        slider.step = '1';
        slider.value = String(state.colorCount);
        slider.className = 'count-slider';
        slider.style.setProperty('--range-percent', `${((state.colorCount - 2) / 6) * 100}%`);
        slider.addEventListener('input', (event) => {
          const nextCount = clampCount(event.target.value);
          if (nextCount === state.colorCount) return;
          state.colorCount = nextCount;
          const previousPercentages = [...state.percentages];
          const previousLength = previousPercentages.length;
          while (state.percentages.length < state.colorCount) {
            state.percentages.push(0);
          }
          const target = Array.from({ length: state.colorCount }, (_, index) => {
            if (index < previousLength && previousPercentages[index] > 0) return previousPercentages[index];
            return Math.round(100 / state.colorCount);
          });
          const sum = target.reduce((x, y) => x + y, 0);
          if (sum !== 100) {
            const adjustment = 100 - sum;
            target[target.length - 1] += adjustment;
          }
          state.percentages = target.map((value) => Math.max(1, value));
          while (state.percentages.length > state.colorCount) {
            state.percentages.pop();
          }
          normalizeColorCount();
          renderAll();
        });

        const meta = document.createElement('div');
        meta.className = 'count-slider-meta';
        meta.innerHTML = '<span>Color count</span><span class="count-slider-value">' + state.colorCount + '</span>';

        sliderWrap.appendChild(slider);
        sliderWrap.appendChild(meta);
        countPicker.appendChild(sliderWrap);

        for (let i = 2; i <= 8; i += 1) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `count-button ${state.colorCount === i ? 'active' : ''}`;
          button.textContent = i;
          button.addEventListener('click', () => {
            state.colorCount = i;
            const previousPercentages = [...state.percentages];
            const previousLength = previousPercentages.length;
            while (state.percentages.length < state.colorCount) {
              state.percentages.push(0);
            }
            const target = Array.from({ length: state.colorCount }, (_, index) => {
              if (index < previousLength && previousPercentages[index] > 0) return previousPercentages[index];
              return Math.round(100 / state.colorCount);
            });
            const sum = target.reduce((x, y) => x + y, 0);
            if (sum !== 100) {
              const adjustment = 100 - sum;
              target[target.length - 1] += adjustment;
            }
            state.percentages = target.map((value) => Math.max(1, value));
            while (state.percentages.length > state.colorCount) {
              state.percentages.pop();
            }
            normalizeColorCount();
            renderAll();
          });
          countPicker.appendChild(button);
        }
      }

          colorPicker.addEventListener('input', (event) => {
            state.colors[index].hex = normalizeHex(event.target.value, '#D9C1BB');

          const hexInput = document.createElement('input');
          hexInput.type = 'text';
          hexInput.className = 'hex-input';
          hexInput.value = normalizeHex(colorEntry.hex, '#D9C1BB').toUpperCase();
          hexInput.setAttribute('maxlength', '7');
          hexInput.addEventListener('change', (event) => {
            const nextValue = normalizeHex(event.target.value, state.colors[index].hex);

          swatchWrap.appendChild(colorPicker);

          const removeButton = document.createElement('button');
          removeButton.type = 'button';
          removeButton.className = 'remove-button';

          removeButton.title = 'Remove color';
          removeButton.disabled = state.colorCount <= 2;
          removeButton.addEventListener('click', () => {
            if (state.colorCount <= 2) return;
            state.colorCount -= 1;
            state.colors.splice(index, 1);
            state.percentages.splice(index, 1);
            while (state.percentages.length < state.colorCount) {
              state.percentages.push(0);
            }
            const total = state.percentages.reduce((sum, value) => sum + Number(value || 0), 0);
            if (total !== 100) {
              const adjustment = 100 - total;
              state.percentages[state.percentages.length - 1] += adjustment;
            }
            state.colors = state.colors.map((entry, idx) => ({
              ...entry,
              name: entry.name || defaultNames[idx] || `Color ${idx + 1}`
            }));
            renderAll();
          });

          row.appendChild(order);
          row.appendChild(swatchWrap);
          row.appendChild(document.createTextNode(''));

          colorFields.appendChild(row);
        });
      }

      function renderPresets() {
        presetGrid.innerHTML = '';
        Object.entries(presetPalettes).forEach(([label, palette]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'preset-button';
          button.textContent = label;
          button.addEventListener('click', () => {
            const newColors = palette.map((hex, idx) => ({
              hex: normalizeHex(hex),
              name: defaultNames[idx] || `Color ${idx + 1}`
            }));
            state.colors = newColors.slice(0, state.colorCount);
            while (state.colors.length < state.colorCount) {
              state.colors.push({
                hex: normalizeHex(palette[(state.colors.length) % palette.length]),
                name: defaultNames[state.colors.length] || `Color ${state.colors.length + 1}`
              });
            }
            const targetPercentages = Array.from({ length: state.colorCount }, (_, idx) => {
              const raw = 100 / state.colorCount;
              return idx === state.colorCount - 1 ? Number((100 - ((state.colorCount - 1) * raw)).toFixed(2)) : raw;
            });
            state.percentages = targetPercentages;
            renderAll();
          });
          presetGrid.appendChild(button);
        });
      }

      function renderStyles() {
        styleGrid.innerHTML = '';
        Object.entries(aestheticCatalog).forEach(([key, value]) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = `style-card ${state.selectedAesthetic === key ? 'active' : ''}`;
          card.innerHTML = `<small>${value.mood}</small><strong>${value.label}</strong>`;
          card.addEventListener('click', () => {
            state.selectedAesthetic = key;
            renderStyles();
            generateMoodboard();
          });
          styleGrid.appendChild(card);
        });

      function adjustPercentages(index, nextValue) {
        const safeNext = Math.min(99, Math.max(1, Number(nextValue) || 1));
        const oldValue = Number(state.percentages[index] || 0);
        state.percentages[index] = safeNext;

        const otherIndex = state.percentages
          .map((value, i) => ({ value: Number(value || 0), i }))
          .filter((entry) => entry.i !== index)
          .map((entry) => entry.value);

        const othersTotal = otherIndex.reduce((sum, value) => sum + value, 0) || 1;
        const remaining = 100 - safeNext;
        const adjusted = state.percentages.map((value, i) => {
          if (i === index) return safeNext;
          const base = (Number(value || 0) / othersTotal) * remaining;
          return Number(base.toFixed(1));
        });

        const currentSum = adjusted.reduce((sum, value) => sum + value, 0);
        const diff = 100 - currentSum;
        adjusted[adjusted.length - 1] += diff;

        state.percentages = adjusted.map((value) => Math.max(1, Math.round(value)));
        const finalTotal = state.percentages.reduce((sum, value) => sum + value, 0);
        if (finalTotal !== 100) {
          const delta = 100 - finalTotal;
          state.percentages[state.percentages.length - 1] += delta;
        }

        if (oldValue === safeNext) {
          state.percentages[index] = safeNext;
        }
      }

      function generateMoodboard() {
        const aesthetic = aestheticCatalog[state.selectedAesthetic] || aestheticCatalog.Coquette;
        const orderedIndexes = sortColorIndexesByPercentage(state.colors, state.percentages);
        const dominantIndex = orderedIndexes[0];
        const secondaryIndex = orderedIndexes[1] ?? dominantIndex;
        const accentIndex = orderedIndexes[2] ?? dominantIndex;

        const dominant = normalizeHex(state.colors[dominantIndex].hex);
        const secondary = normalizeHex(state.colors[secondaryIndex].hex);
        const accent = normalizeHex(state.colors[accentIndex].hex);
        const bg = aesthetic.background || mixHex('#F7F2EC', dominant, 0.36);

        descriptionText.textContent = `${aesthetic.description} The dominant ${state.colors[dominantIndex].name || 'primary'} tone carries the overall focus, while ${state.colors[secondaryIndex].name || 'secondary'} and ${state.colors[accentIndex].name || 'accent'} harmonize the supporting story.`;

          dominant,
          secondary,
          accent,
          bg,
          leftPanel,
          rightPanel,
          glow,
          seed,

      function addColorItem() {
        if (state.colorCount >= 8) return;
        state.colorCount += 1;
        const nextIndex = state.colors.length;
        const hex = presetPalettes.Rosy[nextIndex % presetPalettes.Rosy.length];
        state.colors.push({
          hex: normalizeHex(hex),
          name: defaultNames[nextIndex] || `Color ${nextIndex + 1}`
        });
        state.percentages.push(Math.round(100 / state.colorCount));
        const total = state.percentages.reduce((sum, value) => sum + value, 0);
        if (total !== 100) {
          state.percentages[state.percentages.length - 1] += 100 - total;
        }
        renderAll();
      }

      function resetState() {
        state.colorCount = 4;
        state.selectedAesthetic = 'Coquette';
        state.colors = [
          { hex: '#F4E9D8', name: 'Cream' },
          { hex: '#C98F94', name: 'Dusty Rose' },
          { hex: '#604238', name: 'Chocolate' },
          { hex: '#A3A98C', name: 'Sage' }
        ];
        state.percentages = [50, 25, 15, 10];
        state.seed = Date.now();
        renderAll();
      }

      function renderAll() {
        normalizeColorCount();
        renderCountPicker();
        renderColorFields();
        renderPresets();
        renderStyles();
        renderDistribution();
        renderPalette();
        renderDistributionSummary();
        generateMoodboard();
      }

      document.getElementById('generateBtn').addEventListener('click', () => {
        state.seed += 1;
        generateMoodboard();
      });

      document.getElementById('regenerateBtn').addEventListener('click', () => {
        state.seed = Date.now();
        generateMoodboard();
      });

      document.getElementById('resetBtn').addEventListener('click', resetState);

      document.getElementById('downloadBtn').addEventListener('click', () => {
        const svg = document.getElementById('moodboardSvg');
        const serializer = new XMLSerializer();
        const source = serializer.serializeToString(svg);
        const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const image = new Image();

        image.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 1500;
          canvas.height = 900;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#f6f1ea';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

          const pngUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.href = pngUrl;
          link.download = `${state.selectedAesthetic.toLowerCase().replace(/\s+/g, '-')}-aesthetic.png`;
          link.click();
          URL.revokeObjectURL(url);
        };

        image.src = url;
      });

      renderAll();
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('hex-input')) {
          document.activeElement.blur();
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'g') {
          event.preventDefault();
          state.seed += 1;
          generateMoodboard();
        }
      });

      const addColorButton = document.createElement('button');
      addColorButton.type = 'button';
      addColorButton.className = 'count-button';
      addColorButton.textContent = '+';
      addColorButton.title = 'Add a color';
      addColorButton.addEventListener('click', addColorItem);
      countPicker.appendChild(addColorButton);
    </script>
